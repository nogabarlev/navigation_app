<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>לומדת ניווטים – תרגול</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a href="index.html" class="logo-link" aria-label="חזרה לעמוד הפתיחה"><img src="media/logo.png" alt="לוגו שבטה"></a>
  <b>לומדת ניווטים</b><span id="prog"></span>
</header><main class="wrap">

  <section id="quiz" class="card">
    <h2 id="qText"></h2>
    <div id="qImg"></div>
    <div id="opts" class="opts"></div>
    <div id="fb" class="fb hidden"></div>
    <div class="navrow">
    <button id="qBack" class="btn ghost hidden">הקודמת</button>
    <button id="qCheck" class="btn hidden">בדיקה</button>
    <button id="qNext" class="btn hidden">המשך</button>
</div>
  </section>

  <section id="practice" class="hidden">
    <div class="card">
      <h2>תרגול: מה הזווית מנקודה A לנקודה B?</h2>
      <p id="step"></p>
    </div>
    <svg id="map" viewBox="0 0 600 600" aria-label="מפת תרגול"></svg>
    <div class="card row">
      <label>הזווית (במעלות): <input id="ans" type="number" min="0" max="360" inputmode="numeric"></label>
      <button id="check" class="btn">בדיקה</button>
      <label class="small"><input id="live" type="checkbox"> הצג לי את הקריאה</label>
      <b id="hintOut"></b>
    </div>
    <div id="pfb" class="fb hidden"></div>
    <button id="pNext" class="btn hidden">הסיבוב הבא</button>
  </section>

<section id="end" class="card end hidden">
  <div id="endMedal" class="medal" role="button" tabindex="0" aria-label="חגיגה">🏅</div>
  <h2 id="endTitle">סיימתם!</h2>
  <p id="endSub" class="end-sub"></p>
  <div class="ring">
    <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle id="ringFg" class="fg" cx="60" cy="60" r="52"/></svg>
    <b><span id="ringNum">0</span>%</b>
  </div>
  <div id="endGrid" class="end-grid"></div>
  <div class="end-actions">
    <button id="again" class="btn ghost">נסו שוב</button>
    <a class="btn" href="index.html">חזרה להתחלה</a>
  </div>
</section>

</main>
<script src="code.js"></script>
</body>
</html>
